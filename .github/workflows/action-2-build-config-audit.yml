name: Action 2 Workers Builds configuration audit
on:
  push:
    branches:
      - audit/action-2-build-config-2026-10-26
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - name: Read Workers Builds configuration
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          mkdir -p action-2-build-config
          if [[ -z "${CLOUDFLARE_API_TOKEN:-}" ]]; then
            echo "Missing CLOUDFLARE_API_TOKEN" >&2
            exit 1
          fi
          auth="Authorization: Bearer ${CLOUDFLARE_API_TOKEN}"
          accounts_file="action-2-build-config/accounts.json"
          curl --fail-with-body --silent --show-error             --header "${auth}"             --header 'Content-Type: application/json'             "https://api.cloudflare.com/client/v4/accounts"             > "${accounts_file}"
          jq -e '.success == true' "${accounts_file}" >/dev/null
          while IFS= read -r account_id; do
            [[ -n "${account_id}" ]] || continue
            echo "::add-mask::${account_id}"
            output="action-2-build-config/build-triggers-${account_id}.json"
            status="$(curl --silent --show-error --output "${output}.tmp" --write-out '%{http_code}'               --header "${auth}"               --header 'Content-Type: application/json'               "https://api.cloudflare.com/client/v4/accounts/${account_id}/builds/triggers")"
            if [[ "${status}" =~ ^2 ]]; then
              jq '{success, result: [.result[] | {trigger_uuid, trigger_name, external_script_id, build_command, deploy_command, root_directory, branch_includes, branch_excludes, path_includes, path_excludes, build_caching_enabled, repo_connection: (.repo_connection | {provider_type, provider_account_name, repo_name})}]}' "${output}.tmp" > "${output}"
            else
              jq -n --arg status "${status}" --arg body "$(tr '\n' ' ' < "${output}.tmp" | head -c 2000)" '{http_status:$status,error_body:$body}' > "${output}"
            fi
            rm -f "${output}.tmp"
          done < <(jq -r '.result[].id' "${accounts_file}")
          rm -f "${accounts_file}"
      - uses: actions/upload-artifact@v4
        with:
          name: action-2-workers-builds-config
          path: action-2-build-config
          if-no-files-found: error
          retention-days: 7
