name: Deploy production

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: london-advanced-production
  cancel-in-progress: false

jobs:
  test-migrate-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      HEIGIT_API_KEY: ${{ secrets.HEIGIT_API_KEY }}
      GEOAPIFY_API_KEY: ${{ secrets.GEOAPIFY_API_KEY }}
      TFL_API_KEY: ${{ secrets.TFL_API_KEY }}
      ADMIN_EMAIL: ppastorin@gmail.com
      PRODUCTION_HOST: london-by-mood.ppastorin.workers.dev

    steps:
      - name: Check out the production branch
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Resolve the development and production Cloudflare accounts
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "${CLOUDFLARE_API_TOKEN:-}" ]]; then
            echo "Missing GitHub repository secret CLOUDFLARE_API_TOKEN" >&2
            exit 1
          fi
          response="$(curl --fail --silent --show-error \
            --header "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            --header "Content-Type: application/json" \
            https://api.cloudflare.com/client/v4/accounts)"
          development_database_id="$(jq -r '.d1_databases[0].database_id' wrangler.dev.jsonc)"
          development_matches=()
          production_matches=()
          while IFS= read -r candidate; do
            echo "::add-mask::${candidate}"
            database_probe="$(curl --silent --show-error \
              --header "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
              --header "Content-Type: application/json" \
              "https://api.cloudflare.com/client/v4/accounts/${candidate}/d1/database/${development_database_id}")"
            if jq -e --arg id "${development_database_id}" '.success == true and .result.uuid == $id' <<<"${database_probe}" >/dev/null; then
              development_matches+=("${candidate}")
            fi
            worker_status="$(curl --silent --output /dev/null --write-out '%{http_code}' \
              --header "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
              "https://api.cloudflare.com/client/v4/accounts/${candidate}/workers/scripts/london-by-mood")"
            if [[ "${worker_status}" == "200" ]]; then
              production_matches+=("${candidate}")
            fi
          done < <(jq -r '.result[].id' <<<"${response}")
          if [[ "${#development_matches[@]}" != "1" ]]; then
            echo "Could not uniquely resolve the account containing the configured development D1 database; matches=${#development_matches[@]}." >&2
            exit 1
          fi
          if [[ "${#production_matches[@]}" != "1" ]]; then
            echo "Could not uniquely resolve the account containing the existing london-by-mood Worker; matches=${#production_matches[@]}." >&2
            exit 1
          fi
          development_account_id="${development_matches[0]}"
          production_account_id="${production_matches[0]}"
          echo "::add-mask::${development_account_id}"
          echo "::add-mask::${production_account_id}"
          echo "DEVELOPMENT_ACCOUNT_ID=${development_account_id}" >> "${GITHUB_ENV}"
          echo "PRODUCTION_ACCOUNT_ID=${production_account_id}" >> "${GITHUB_ENV}"

      - name: Check source and unit tests
        run: npm run check && npm test

      - name: Protect the private editor with Cloudflare Access
        shell: bash
        run: |
          set -euo pipefail
          api="https://api.cloudflare.com/client/v4/accounts/${PRODUCTION_ACCOUNT_ID}/access"
          auth_header="Authorization: Bearer ${CLOUDFLARE_API_TOKEN}"
          editor_domain="${PRODUCTION_HOST}/admin"

          apps_file="$(mktemp)"
          apps_status="$(curl --silent --show-error \
            --output "${apps_file}" \
            --write-out '%{http_code}' \
            --header "${auth_header}" \
            "${api}/apps?per_page=100")"
          apps="$(cat "${apps_file}")"
          rm -f "${apps_file}"
          if [[ "${apps_status}" != "200" ]]; then
            echo "Cloudflare Access API returned HTTP ${apps_status}." >&2
            jq -c '{success, errors, messages}' <<<"${apps}" >&2 || echo "Cloudflare returned a non-JSON error response." >&2
            exit 1
          fi
          app_id="$(jq -r --arg domain "${editor_domain}" '.result[] | select(.domain == $domain) | .id' <<<"${apps}" | head -n 1)"
          if [[ -z "${app_id}" ]]; then
            app_body="$(jq -n --arg domain "${editor_domain}" '{name:"London Advanced places editor",domain:$domain,type:"self_hosted",session_duration:"24h",app_launcher_visible:false,allow_iframe:false}')"
            created="$(curl --fail --silent --show-error \
              --request POST \
              --header "${auth_header}" \
              --header "Content-Type: application/json" \
              --data "${app_body}" \
              "${api}/apps")"
            app_id="$(jq -r '.result.id' <<<"${created}")"
          fi
          if [[ -z "${app_id}" || "${app_id}" == "null" ]]; then
            echo "Could not resolve the Cloudflare Access application." >&2
            exit 1
          fi
          echo "::add-mask::${app_id}"

          policy_name="Allow Paolo Pastorino"
          policy_body="$(jq -n --arg name "${policy_name}" --arg email "${ADMIN_EMAIL}" '{name:$name,decision:"allow",precedence:1,include:[{email:{email:$email}}],exclude:[],require:[]}')"
          policies="$(curl --fail --silent --show-error --header "${auth_header}" "${api}/apps/${app_id}/policies?per_page=100")"
          policy_id="$(jq -r --arg name "${policy_name}" '.result[] | select(.name == $name) | .id' <<<"${policies}" | head -n 1)"
          if [[ -n "${policy_id}" ]]; then
            curl --fail --silent --show-error \
              --request PUT \
              --header "${auth_header}" \
              --header "Content-Type: application/json" \
              --data "${policy_body}" \
              "${api}/apps/${app_id}/policies/${policy_id}" >/dev/null
          else
            curl --fail --silent --show-error \
              --request POST \
              --header "${auth_header}" \
              --header "Content-Type: application/json" \
              --data "${policy_body}" \
              "${api}/apps/${app_id}/policies" >/dev/null
          fi
          echo "Cloudflare Access protects /admin for the approved email."

      - name: Resolve or create the production D1 database
        shell: bash
        run: |
          set -euo pipefail
          export CLOUDFLARE_ACCOUNT_ID="${PRODUCTION_ACCOUNT_ID}"
          databases="$(npx wrangler d1 list --json)"
          database_id="$(jq -r '.[] | select(.name == "london-advanced-places") | .uuid' <<<"${databases}" | head -n 1)"
          if [[ -z "${database_id}" ]]; then
            npx wrangler d1 create london-advanced-places --location weur
            databases="$(npx wrangler d1 list --json)"
            database_id="$(jq -r '.[] | select(.name == "london-advanced-places") | .uuid' <<<"${databases}" | head -n 1)"
          fi
          if [[ -z "${database_id}" || "${database_id}" == "null" ]]; then
            echo "Could not resolve the production D1 database." >&2
            exit 1
          fi
          echo "::add-mask::${database_id}"
          jq --arg id "${database_id}" '.d1_databases[0].database_id = $id' wrangler.jsonc > wrangler.production.runtime.jsonc

      - name: Apply production D1 migrations
        run: CLOUDFLARE_ACCOUNT_ID="${PRODUCTION_ACCOUNT_ID}" npx wrangler d1 migrations apply DB --remote --config wrangler.production.runtime.jsonc

      - name: Seed an empty production database from the accepted development baseline
        shell: bash
        run: |
          set -euo pipefail
          production_result="$(CLOUDFLARE_ACCOUNT_ID="${PRODUCTION_ACCOUNT_ID}" npx wrangler d1 execute DB --remote --config wrangler.production.runtime.jsonc --command 'SELECT COUNT(*) AS count FROM places' --json)"
          production_count="$(jq -r '.[0].results[0].count' <<<"${production_result}")"
          development_result="$(CLOUDFLARE_ACCOUNT_ID="${DEVELOPMENT_ACCOUNT_ID}" npx wrangler d1 execute DB --remote --config wrangler.dev.jsonc --command 'SELECT COUNT(*) AS count FROM places' --json)"
          development_count="$(jq -r '.[0].results[0].count' <<<"${development_result}")"
          if [[ "${development_count}" != "881" ]]; then
            echo "Expected 881 accepted development places; found ${development_count}." >&2
            exit 1
          fi
          if [[ "${production_count}" == "0" ]]; then
            cleanup_exports() { rm -f /tmp/places.sql /tmp/place_time_affinity.sql /tmp/place_stations.sql; }
            trap cleanup_exports EXIT
            for table in places place_time_affinity place_stations; do
              export_file="/tmp/${table}.sql"
              CLOUDFLARE_ACCOUNT_ID="${DEVELOPMENT_ACCOUNT_ID}" npx wrangler d1 export DB \
                --remote --config wrangler.dev.jsonc --table "${table}" --no-schema --output "${export_file}" --skip-confirmation
              CLOUDFLARE_ACCOUNT_ID="${PRODUCTION_ACCOUNT_ID}" npx wrangler d1 execute DB \
                --remote --config wrangler.production.runtime.jsonc --file "${export_file}" --yes
            done
            cleanup_exports
            trap - EXIT
          elif [[ "${production_count}" -lt "${development_count}" ]]; then
            echo "Production contains fewer places (${production_count}) than the accepted development baseline (${development_count})." >&2
            exit 1
          fi

      - name: Verify production database integrity
        shell: bash
        run: |
          set -euo pipefail
          integrity="$(CLOUDFLARE_ACCOUNT_ID="${PRODUCTION_ACCOUNT_ID}" npx wrangler d1 execute DB --remote --config wrangler.production.runtime.jsonc --command \
            "SELECT COUNT(*) AS total, SUM(CASE WHEN status='published' THEN 1 ELSE 0 END) AS published, SUM(CASE WHEN status='published' AND (trim(description_en)='' OR trim(description_it)='') THEN 1 ELSE 0 END) AS missing_descriptions FROM places" --json)"
          total="$(jq -r '.[0].results[0].total' <<<"${integrity}")"
          published="$(jq -r '.[0].results[0].published' <<<"${integrity}")"
          missing_descriptions="$(jq -r '.[0].results[0].missing_descriptions' <<<"${integrity}")"
          if [[ "${total}" -lt "881" || "${published}" -lt "881" ]]; then
            echo "Production catalogue regressed: total=${total}, published=${published}." >&2
            exit 1
          fi
          if [[ "${missing_descriptions}" -gt "165" ]]; then
            echo "Bilingual-description debt increased above the recorded legacy baseline: ${missing_descriptions} incomplete published places." >&2
            exit 1
          fi
          echo "Production catalogue: total=${total}, published=${published}, incomplete bilingual legacy records=${missing_descriptions}."

      - name: Synchronise the production walking-route API key
        if: env.HEIGIT_API_KEY != ''
        shell: bash
        run: printf '%s' "${HEIGIT_API_KEY}" | CLOUDFLARE_ACCOUNT_ID="${PRODUCTION_ACCOUNT_ID}" npx wrangler secret put HEIGIT_API_KEY --config wrangler.production.runtime.jsonc

      - name: Synchronise the production fallback walking-route API key
        if: env.GEOAPIFY_API_KEY != ''
        shell: bash
        run: printf '%s' "${GEOAPIFY_API_KEY}" | CLOUDFLARE_ACCOUNT_ID="${PRODUCTION_ACCOUNT_ID}" npx wrangler secret put GEOAPIFY_API_KEY --config wrangler.production.runtime.jsonc

      - name: Synchronise the production TfL API key
        if: env.TFL_API_KEY != ''
        shell: bash
        run: printf '%s' "${TFL_API_KEY}" | CLOUDFLARE_ACCOUNT_ID="${PRODUCTION_ACCOUNT_ID}" npx wrangler secret put TFL_API_KEY --config wrangler.production.runtime.jsonc

      - name: Deploy the production Worker
        run: CLOUDFLARE_ACCOUNT_ID="${PRODUCTION_ACCOUNT_ID}" npx wrangler deploy --config wrangler.production.runtime.jsonc

      - name: Verify the production application
        shell: bash
        run: |
          set -euo pipefail
          base_url="https://${PRODUCTION_HOST}"
          health="$(curl --fail --silent --show-error --retry 5 --retry-delay 3 "${base_url}/health")"
          jq -e '.ok == true and .database == "d1" and .integrations.walkingRoutingPrimary == "authenticated" and .integrations.walkingRoutingFallback == "authenticated" and .integrations.tflBikePoint == "authenticated"' <<<"${health}" >/dev/null
          places="$(curl --fail --silent --show-error --retry 5 --retry-delay 3 "${base_url}/api/pois?limit=2000")"
          jq -e '.ok == true and .count >= 885' <<<"${places}" >/dev/null
          for place in 'Lonsdale Road' 'Aberfeldy Street Murals' 'Turin Street' 'Blackheath Village'; do
            jq -e --arg place "${place}" '.places | any(.name == $place and .status == "published" and (.description | length) > 80 and (.descriptionIt | length) > 80)' <<<"${places}" >/dev/null
          done
          mood_html="$(curl --fail --silent --show-error "${base_url}/")"
          grep -q "London by Mood" <<<"${mood_html}"
          navigation_html="$(curl --fail --silent --show-error "${base_url}/smart-navigation/")"
          grep -q "Smart Navigation" <<<"${navigation_html}"

          admin_status="200"
          for attempt in 1 2 3 4 5 6; do
            admin_status="$(curl --silent --output /dev/null --write-out '%{http_code}' --max-redirs 0 "${base_url}/admin/")"
            [[ "${admin_status}" != "200" && "${admin_status}" != "404" ]] && break
            echo "Editor protection attempt ${attempt} returned HTTP ${admin_status}; waiting for Access and Worker propagation."
            sleep 3
          done
          if [[ "${admin_status}" == "200" || "${admin_status}" == "404" ]]; then
            echo "The private editor was not protected after propagation (HTTP ${admin_status})." >&2
            exit 1
          fi
          api_status="200"
          for attempt in 1 2 3 4 5 6; do
            api_status="$(curl --silent --output /dev/null --write-out '%{http_code}' --max-redirs 0 "${base_url}/admin/api/places?limit=1")"
            [[ "${api_status}" != "200" && "${api_status}" != "404" ]] && break
            echo "Editor API protection attempt ${attempt} returned HTTP ${api_status}; waiting for Access and Worker propagation."
            sleep 3
          done
          if [[ "${api_status}" == "200" || "${api_status}" == "404" ]]; then
            echo "The private editor API was not protected after propagation (HTTP ${api_status})." >&2
            exit 1
          fi

          route="$(curl --fail --silent --show-error \
            --request POST \
            --header 'Content-Type: application/json' \
            --data '{"start":{"lat":51.507587,"lon":-0.127716},"end":{"lat":51.515008,"lon":-0.102911}}' \
