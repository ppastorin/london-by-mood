name: Deploy D1 development

on:
  push:
    branches:
      - dev/d1-places-platform
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: london-advanced-d1-development
  cancel-in-progress: false

jobs:
  test-migrate-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      HEIGIT_API_KEY: ${{ secrets.HEIGIT_API_KEY }}

    steps:
      - name: Check out the development branch
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate the deployment token and resolve its account
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "${CLOUDFLARE_API_TOKEN:-}" ]]; then
            echo "Missing GitHub repository secret CLOUDFLARE_API_TOKEN" >&2
            exit 1
          fi
          response="$(curl --fail --silent --show-error \
            --header "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            --header "Content-Type: application/json" \
            https://api.cloudflare.com/client/v4/accounts)"
          count="$(jq -r '.result | length' <<<"${response}")"
          if [[ "$(jq -r '.success' <<<"${response}")" != "true" || "${count}" != "1" ]]; then
            echo "The token must grant access to exactly one Cloudflare account; found ${count}." >&2
            exit 1
          fi
          account_id="$(jq -r '.result[0].id' <<<"${response}")"
          echo "::add-mask::${account_id}"
          echo "CLOUDFLARE_ACCOUNT_ID=${account_id}" >> "${GITHUB_ENV}"

      - name: Check source and unit tests
        run: npm run check && npm test

      - name: Synchronise the walking-route API key
        if: env.HEIGIT_API_KEY != ''
        shell: bash
        run: printf '%s' "${HEIGIT_API_KEY}" | npx wrangler secret put HEIGIT_API_KEY --config wrangler.dev.jsonc

      - name: Apply pending D1 migrations
        run: npx wrangler d1 migrations apply DB --remote --config wrangler.dev.jsonc

      - name: Deploy the development Worker
        run: npx wrangler deploy --config wrangler.dev.jsonc

      - name: Verify the deployed application
        shell: bash
        run: |
          set -euo pipefail
          base_url="https://london-advanced-d1-prototype.screeching-drizzle.workers.dev"
          health="$(curl --fail --silent --show-error --retry 5 --retry-delay 3 "${base_url}/health")"
          jq -e '.ok == true and .database == "d1"' <<<"${health}" >/dev/null
          places="$(curl --fail --silent --show-error --retry 5 --retry-delay 3 "${base_url}/api/pois?limit=2000")"
          jq -e '.ok == true and .count == 881' <<<"${places}" >/dev/null
          admin_status="000"
          for attempt in 1 2 3 4 5 6; do
            admin_status="$(curl --silent --output /dev/null --write-out '%{http_code}' "${base_url}/admin/api/places?limit=1")"
            [[ "${admin_status}" == "401" ]] && break
            echo "Admin verification attempt ${attempt} returned HTTP ${admin_status}; waiting for deployment propagation."
            sleep 3
          done
          if [[ "${admin_status}" != "401" ]]; then
            echo "Expected anonymous admin request to return 401; received ${admin_status}." >&2
            exit 1
          fi
          if [[ -n "${HEIGIT_API_KEY:-}" ]]; then
            route_file="$(mktemp)"
            route_status="000"
            for attempt in 1 2 3 4 5 6; do
              route_status="$(curl --silent --show-error \
                --request POST \
                --header 'Content-Type: application/json' \
                --data '{"start":{"lat":51.507587,"lon":-0.127716},"end":{"lat":51.515008,"lon":-0.102911}}' \
                --output "${route_file}" \
                --write-out '%{http_code}' \
                "${base_url}/api/route")"
              if [[ "${route_status}" == "200" ]]; then
                break
              fi
              echo "Walking-route verification attempt ${attempt} returned HTTP ${route_status}; waiting for deployment propagation."
              sleep 3
            done
            if [[ "${route_status}" != "200" ]]; then
              tail_log="$(mktemp)"
              timeout 15s npx wrangler tail --config wrangler.dev.jsonc --format pretty >"${tail_log}" 2>&1 &
              tail_pid=$!
              sleep 4
              curl --silent --show-error \
                --request POST \
                --header 'Content-Type: application/json' \
                --data '{"start":{"lat":51.507587,"lon":-0.127716},"end":{"lat":51.515008,"lon":-0.102911}}' \
                --output "${route_file}" \
                "${base_url}/api/route" || true
              sleep 3
              kill "${tail_pid}" 2>/dev/null || true
              wait "${tail_pid}" 2>/dev/null || true
              echo "Walking-route verification returned HTTP ${route_status}." >&2
              echo "Response body:" >&2
              sed -n '1,20p' "${route_file}" >&2
              echo "Worker trace:" >&2
              sed -n '1,160p' "${tail_log}" >&2
              exit 1
            fi
            route="$(cat "${route_file}")"
            jq -e '.ok == true and (.geometry.coordinates | length) > 1 and .distanceMetres > 0' <<<"${route}" >/dev/null
          fi
          echo "Development verification passed: 881 published places and protected admin API."
